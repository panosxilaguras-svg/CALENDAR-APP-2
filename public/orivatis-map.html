<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ORIVATIS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body{width:100%;height:100%;margin:0;background:#dce6d9;overflow:hidden}#map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#dce6d9}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .leaflet-control-attribution{font-size:8px;opacity:.72}
    .leaflet-control-zoom{border:0!important;box-shadow:0 10px 28px rgba(22,37,28,.18)!important}
    .leaflet-control-zoom a{border:0!important;width:38px!important;height:38px!important;line-height:38px!important;background:rgba(255,254,250,.96)!important;color:#173321!important}
    .hm-shell{background:transparent!important;border:0!important}
    .hm-pin{width:46px;height:46px;border:4px solid white;border-radius:50% 50% 50% 15px;display:grid;place-items:center;transform:rotate(-45deg);background:#173321;color:#dceebd;box-shadow:0 11px 26px rgba(18,35,24,.28)}
    .hm-pin span{transform:rotate(45deg);font-size:19px;font-weight:900}
    .hm-pin.hard{background:#ef6a3a;color:white}
    .hm-pin.easy{background:#a9c997;color:#173321}
    .hm-pick{width:38px;height:38px;border:4px solid white;border-radius:50% 50% 50% 13px;background:#ef6a3a;transform:rotate(-45deg);box-shadow:0 10px 24px rgba(90,45,28,.28)}
    .pick-tip{position:absolute;z-index:500;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 30px);padding:10px 14px;border-radius:999px;background:rgba(255,254,250,.94);color:#173321;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(20,35,25,.15);pointer-events:none;white-space:nowrap}
    .route-panel{position:absolute;z-index:650;left:12px;right:12px;top:12px;display:none;gap:7px;padding:9px;border-radius:16px;background:rgba(255,254,250,.95);box-shadow:0 12px 32px rgba(20,35,25,.18);overflow-x:auto}
    .route-panel.show{display:flex}.route-choice{flex:0 0 auto;border:1px solid rgba(23,51,33,.14);background:#fffefa;color:#173321;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800}.route-choice.active{background:#173321;color:white}.route-loading{font-size:10px;font-weight:800;color:#667269;padding:8px 10px;white-space:nowrap}
    @media(max-width:820px){.leaflet-control-zoom{display:none}.pick-tip{font-size:11px;bottom:12px}}
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode') || 'browse';
      var detailMode = params.get('detail') === '1';
      var hikes = [];
      try { hikes = JSON.parse(params.get('data') || '[]'); } catch (_) {}

      var map = L.map('map', {
        zoomControl: false,
        attributionControl: true,
        minZoom: 5,
        maxZoom: 18
      });

      var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      });

      var topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxNativeZoom: 17,
        maxZoom: 19,
        attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Map style &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
      });

      // ORIVATIS is an outdoor app: the picker opens directly on a topographic
      // layer so mountains, relief, paths and peaks are visible before placing a pin.
      if (mode === 'pick') topoLayer.addTo(map);
      else streetLayer.addTo(map);

      L.control.layers(
        { 'Βουνά / Μονοπάτια': topoLayer, 'Απλός χάρτης': streetLayer },
        null,
        { position: 'topright', collapsed: true }
      ).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      if (mode === 'pick') {
        var hasLatParam = params.has('lat') && params.get('lat') !== '';
        var hasLngParam = params.has('lng') && params.get('lng') !== '';
        var initialLat = hasLatParam ? Number(params.get('lat')) : NaN;
        var initialLng = hasLngParam ? Number(params.get('lng')) : NaN;
        var hasInitial =
          hasLatParam &&
          hasLngParam &&
          Number.isFinite(initialLat) &&
          Number.isFinite(initialLng) &&
          Math.abs(initialLat) <= 90 &&
          Math.abs(initialLng) <= 180;
        var pickRoute = [];
        try { pickRoute = JSON.parse(params.get('route') || '[]'); } catch (_) {}
        pickRoute = Array.isArray(pickRoute)
          ? pickRoute.filter(function (point) {
              return Array.isArray(point) && point.length >= 2 &&
                typeof point[0] === 'number' && typeof point[1] === 'number';
            })
          : [];

        if (pickRoute.length > 1) {
          L.polyline(pickRoute, {
            color: '#fffefa',
            weight: 9,
            opacity: .94,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);
          L.polyline(pickRoute, {
            color: '#ef6a3a',
            weight: 5,
            opacity: .98,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);
        }

        var discoveredRouteLayers = [];
        var discoveredRoutes = [];
        var selectedRoute = pickRoute.length > 1 ? pickRoute : [];
        var routePanel = document.createElement('div');
        routePanel.className = 'route-panel';
        document.body.appendChild(routePanel);

        function clearDiscoveredRoutes() {
          discoveredRouteLayers.forEach(function (layer) { map.removeLayer(layer); });
          discoveredRouteLayers = [];
          discoveredRoutes = [];
          routePanel.className = 'route-panel';
          routePanel.innerHTML = '';
        }

        function joinSegments(segments) {
          if (!segments.length) return [];
          var result = segments[0].slice();
          for (var i = 1; i < segments.length; i++) {
            var segment = segments[i].slice();
            if (!segment.length) continue;
            if (!result.length) { result = segment; continue; }
            var last = result[result.length - 1];
            var dStart = Math.abs(last[0] - segment[0][0]) + Math.abs(last[1] - segment[0][1]);
            var end = segment[segment.length - 1];
            var dEnd = Math.abs(last[0] - end[0]) + Math.abs(last[1] - end[1]);
            if (dEnd < dStart) segment.reverse();
            result = result.concat(segment);
          }
          return result;
        }

        function chooseRoute(index) {
          if (!discoveredRoutes[index]) return;
          selectedRoute = discoveredRoutes[index].points;
          discoveredRouteLayers.forEach(function (layer, layerIndex) {
            layer.setStyle({
              color: layerIndex === index ? '#ef6a3a' : '#54745d',
              weight: layerIndex === index ? 6 : 4,
              opacity: layerIndex === index ? .98 : .62
            });
          });
          Array.prototype.forEach.call(routePanel.querySelectorAll('.route-choice'), function (button, buttonIndex) {
            button.classList.toggle('active', buttonIndex === index);
          });
          parent.postMessage({
            type: 'orivatis-route-select',
            route: selectedRoute,
            name: discoveredRoutes[index].name
          }, '*');
          if (selectedRoute.length) {
            placePick(selectedRoute[0][0], selectedRoute[0][1], true);
            map.fitBounds(L.latLngBounds(selectedRoute), { padding: [28, 28], maxZoom: 15 });
          }
        }

        async function discoverHikingRoutes(lat, lng) {
          clearDiscoveredRoutes();
          routePanel.className = 'route-panel show';
          routePanel.innerHTML = '<span class="route-loading">Ψάχνω μονοπάτια γύρω από το σημείο…</span>';
          var query = '[out:json][timeout:20];(' +
            'relation(around:12000,' + lat + ',' + lng + ')[type=route][route~"^(hiking|foot|walking)$"];' +
            'way(around:4500,' + lat + ',' + lng + ')[highway~"^(path|footway|track)$"];' +
            ');out tags geom;';
          try {
            var response = await fetch('/api/trails?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng), { cache: 'no-store' });
            if (!response.ok) {
              var errorText = '';
              try { errorText = await response.text(); } catch (_) {}
              throw new Error('api_' + response.status + (errorText ? '_' + errorText.slice(0, 80) : ''));
            }
            var json = await response.json();
            var relationRoutes = (json.elements || []).filter(function (element) {
              return element.type === 'relation';
            }).map(function (relation) {
              var segments = (relation.members || []).filter(function (member) {
                return member.type === 'way' && Array.isArray(member.geometry) && member.geometry.length > 1 &&
                  (!member.role || ['main','forward','backward','alternative','approach','excursion','connection'].indexOf(member.role) !== -1);
              }).map(function (member) {
                var points = member.geometry.map(function (point) { return [point.lat, point.lon]; });
                if (member.role === 'backward') points.reverse();
                return points;
              });
              return {
                id: 'r' + relation.id,
                name: (relation.tags && (relation.tags.name || relation.tags.ref)) || 'Πεζοπορική διαδρομή',
                points: joinSegments(segments),
                official: true
              };
            }).filter(function (route) { return route.points.length > 1; });

            var pathWays = (json.elements || []).filter(function (element) {
              return element.type === 'way' && Array.isArray(element.geometry) && element.geometry.length > 1;
            }).map(function (way) {
              return {
                id: 'w' + way.id,
                name: (way.tags && (way.tags.name || way.tags.ref || way.tags.trail_name)) || 'Μονοπάτι',
                points: way.geometry.map(function (point) { return [point.lat, point.lon]; }),
                official: false
              };
            });

            discoveredRoutes = relationRoutes.length
              ? relationRoutes.slice(0, 8)
              : pathWays.slice(0, 8);

            routePanel.innerHTML = '';
            if (!discoveredRoutes.length) {
              routePanel.innerHTML = '<span class="route-loading">Δεν βρέθηκε καταχωρημένη πεζοπορική διαδρομή εδώ.</span>';
              window.setTimeout(function () { routePanel.className = 'route-panel'; }, 2600);
              return;
            }

            discoveredRoutes.forEach(function (route, index) {
              var layer = L.polyline(route.points, {
                color: '#54745d', weight: 4, opacity: .62, lineCap: 'round', lineJoin: 'round'
              }).addTo(map);
              layer.on('click', function (event) {
                if (event.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
                chooseRoute(index);
              });
              discoveredRouteLayers.push(layer);
              var button = document.createElement('button');
              button.type = 'button';
              button.className = 'route-choice';
              button.textContent = route.name + (route.official ? '' : ' · τμήμα');
              button.onclick = function () { chooseRoute(index); };
              routePanel.appendChild(button);
            });

            if (discoveredRoutes.length === 1) chooseRoute(0);
          } catch (error) {
            var detail = error && error.message ? error.message : 'unknown';
            routePanel.innerHTML = '<span class="route-loading">Σφάλμα μονοπατιών · ' + detail.replace(/[<>]/g, '') + '</span>';
          }
        }

        var pickMarker = null;
        var pickIcon = L.divIcon({
          className: 'hm-shell',
          html: '<div class="hm-pick"></div>',
          iconSize: [42, 50],
          iconAnchor: [21, 45]
        });

        function placePick(lat, lng, notify) {
          if (pickMarker) pickMarker.setLatLng([lat, lng]);
          else pickMarker = L.marker([lat, lng], { icon: pickIcon }).addTo(map);
          if (notify) parent.postMessage({ type: 'orivatis-map-pick', lat: lat, lng: lng }, '*');
        }

        if (pickRoute.length > 1) {
          var routeBounds = L.latLngBounds(pickRoute);
          if (hasInitial) placePick(initialLat, initialLng, false);
          else placePick(pickRoute[0][0], pickRoute[0][1], false);
          map.fitBounds(routeBounds, { padding: [34, 34], maxZoom: 15 });
        } else if (hasInitial) {
          placePick(initialLat, initialLng, false);
          map.setView([initialLat, initialLng], 10);
        } else {
          // Start over mainland Greece instead of treating missing query params
          // as numeric zero (0,0), which is ocean in the Gulf of Guinea.
          map.setView([38.45, 23.55], 7);
        }

        var tip = document.createElement('div');
        tip.className = 'pick-tip';
        tip.textContent = pickRoute.length > 1
          ? '✓ Η πραγματική διαδρομή GPX είναι πάνω στον χάρτη'
          : 'Βρες το βουνό και πάτησε ακριβώς στο σημείο';
        document.body.appendChild(tip);

        map.on('click', function (event) {
          placePick(event.latlng.lat, event.latlng.lng, true);
          tip.textContent = 'Ψάχνω αυτόματα πεζοπορικές διαδρομές…';
          discoverHikingRoutes(event.latlng.lat, event.latlng.lng);
          window.setTimeout(function () {
            tip.textContent = 'Πάτησε μονοπάτι για επιλογή ή αλλού για νέο σημείο';
          }, 1200);
        });
        return;
      }

      var bounds = [];
      hikes.forEach(function (hike) {
        if (typeof hike.lat !== 'number' || typeof hike.lng !== 'number') return;
        bounds.push([hike.lat, hike.lng]);

        var route = Array.isArray(hike.route)
          ? hike.route.filter(function (point) {
              return Array.isArray(point) && point.length >= 2 &&
                typeof point[0] === 'number' && typeof point[1] === 'number';
            })
          : [];

        if (route.length > 1) {
          route.forEach(function (point) { bounds.push([point[0], point[1]]); });

          L.polyline(route, {
            color: '#fffefa',
            weight: detailMode ? 9 : 8,
            opacity: .92,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);

          L.polyline(route, {
            color: '#ef6a3a',
            weight: detailMode ? 5 : 4,
            opacity: hike.approximate ? .78 : .96,
            dashArray: hike.approximate ? '10 8' : null,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);
        }

        var cls = hike.difficulty === 'Δύσκολη' ? 'hard' : hike.difficulty === 'Εύκολη' ? 'easy' : 'moderate';
        var icon = L.divIcon({
          className: 'hm-shell',
          html: '<div class="hm-pin ' + cls + '"><span>△</span></div>',
          iconSize: [48, 56],
          iconAnchor: [24, 51]
        });

        var marker = L.marker([hike.lat, hike.lng], { icon: icon }).addTo(map);
        marker.on('click', function () {
          parent.postMessage({ type: 'orivatis-map-select', id: hike.id }, '*');
          map.flyTo([hike.lat, hike.lng], Math.max(map.getZoom(), 9), { duration: 0.45 });
        });
      });

      if (bounds.length === 1) map.setView(bounds[0], detailMode ? 10.5 : 8.4);
      else if (bounds.length > 1) map.fitBounds(bounds, { padding: detailMode ? [34, 34] : [70, 70], maxZoom: detailMode ? 13 : 10 });
      else map.setView([38.35, 23.70], 6.2);

      function refreshMapSize() {
        map.invalidateSize({ pan: false });
      }

      requestAnimationFrame(refreshMapSize);
      setTimeout(refreshMapSize, 80);
      setTimeout(refreshMapSize, 260);
      setTimeout(refreshMapSize, 700);
      window.addEventListener('resize', refreshMapSize);
      window.addEventListener('orientationchange', function () {
        setTimeout(refreshMapSize, 120);
      });

      if ('ResizeObserver' in window) {
        var observer = new ResizeObserver(function () { refreshMapSize(); });
        observer.observe(document.getElementById('map'));
      }
    })();
  </script>
</body>
</html>
